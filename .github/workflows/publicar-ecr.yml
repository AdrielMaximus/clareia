name: Publicar imagem no ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publicar-ecr-main
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Conferir identidade do workflow
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          echo "Repositório: $REPOSITORY"
          echo "Referência: $REF"
      - name: Diagnosticar campos OIDC
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += "&audience=sts.amazonaws.com"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )
          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(
              payload + "=" * (-len(payload) % 4)
          ))
          for field in ("iss", "aud", "sub"):
              print(f"{field}: {claims.get(field)}")
          PY

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::664418955853:role/ClareiaGitHubActions
          aws-region: us-east-2

      - name: Entrar no ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir e enviar imagem
        env:
          ECR_REPOSITORY: 664418955853.dkr.ecr.us-east-2.amazonaws.com/clareia
        run: |
          docker build -t "$ECR_REPOSITORY:$GITHUB_SHA" .
          docker push "$ECR_REPOSITORY:$GITHUB_SHA"